name: kidsafe_launcher
description: A parent-controlled Android home launcher. Phase 1 foundation.
publish_to: none
version: 0.2.1+3
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  cryptography: 2.7.0
  video_player: 2.9.5
  firebase_core: 3.15.2
  firebase_auth: 5.7.0
  cloud_firestore: 5.6.12
  firebase_messaging: 15.2.10
  cloud_functions: 5.6.2
  google_mobile_ads: 5.3.1
  firebase_storage: 12.4.10
  file_picker: 8.3.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
